<main class="relative flex flex-col">
  <div class="small-screen-warning" *ngIf="showWarning()">
    <div class="warning-content">
      <span>⚠️ This app is not optimized for small screens. <br> For the best experience, please use a desktop or larger tablet.</span>
    </div>
    <button class="close-btn mt-2" (click)="dismissWarning()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-8 text-gray-900"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
          />
        </svg>
    </button>
  </div>
  <router-outlet></router-outlet>
</main>
